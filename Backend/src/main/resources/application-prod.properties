# ==========================================
# SERVER CONFIGURATION (PRODUCTION)
# ==========================================
server.port=${PORT:8080}

# ==========================================
# NEON POSTGRESQL DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIKARICP CONNECTION POOL (OPTIMIZED FOR NEON SERVERLESS)
# ==========================================
# Maximum connections in pool - kept at 10 to fit Neon compute limits
spring.datasource.hikari.maximum-pool-size=10
# Minimum idle connections
spring.datasource.hikari.minimum-idle=2
# Time (ms) to wait for a connection before timing out (30s accommodates serverless cold-starts)
spring.datasource.hikari.connection-timeout=30000
# Maximum time (ms) a connection can sit idle before eviction (5 mins)
spring.datasource.hikari.idle-timeout=300000
# Maximum lifetime (ms) of a connection in the pool (10 mins, safely below cloud proxy resets)
spring.datasource.hikari.max-lifetime=600000
# Periodic keepalive ping (ms) to keep idle connections from dropping
spring.datasource.hikari.keepalive-time=30000

# ==========================================
# JPA & HIBERNATE (SAFE SCHEMA MANAGEMENT)
# ==========================================
# update: safely creates/updates tables without deleting existing tables or rows
# In production, can be overridden to 'validate' via SPRING_JPA_HIBERNATE_DDL_AUTO
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CORS CONFIGURATION
# ==========================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ==========================================
# JWT CONFIGURATION
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# RAZORPAY TEST / PROD GATEWAY
# ==========================================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# ==========================================
# FILE UPLOAD LIMITS
# ==========================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

